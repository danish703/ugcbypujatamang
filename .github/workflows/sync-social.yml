name: Auto-Sync Instagram & TikTok Videos

on:
  schedule:
    # Automatically check for new Instagram Reels & TikTok videos every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync new Instagram & TikTok brand videos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SOCIAL_FEED_JSON_URL: ${{ secrets.SOCIAL_FEED_JSON_URL }}
        run: node scripts/sync-social-feed.mjs

      - name: Commit updated videos, photos & covers if changed
        run: |
          git config user.name "Puja Portfolio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/videos.json public/data/photos.json public/images/puja/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync new Instagram/TikTok videos and product photos"
            git push
          else
            echo "No new brand videos or product photos to sync."
          fi

